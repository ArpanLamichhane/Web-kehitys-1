
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>♫ Music Explorer</h1>
        <p>Discover artists, albums and songs</p>
    </header>

    <main>
        <section class="search-section">
            <h2>Find your music</h2>

            <form id="searchForm">
                <input
                    type="text"
                    id="artistSearch"
                    placeholder="Search for an artist..."
                >
                <button type="submit">Search</button>
            </form>
        </section>

        <section>
            <h2>Popular Artists</h2>
            <div id="artistList" class="artist-list">
                <button data-artist="Taylor Swift">Taylor Swift</button>
                <button data-artist="The Weeknd">The Weeknd</button>
                <button data-artist="Drake">Drake</button>
                <button data-artist="Eminem">Eminem</button>
                <button data-artist="Coldplay">Coldplay</button>
                <button data-artist="Adele">Adele</button>
            </div>
        </section>

        <p id="message"></p>

        <section id="artistSection" hidden>
            <h2 id="artistName"></h2>
            <p id="artistInfo"></p>

            <h2>Albums</h2>
            <div id="albumList" class="album-list"></div>
        </section>

        <section id="albumDetails" hidden>
            <h2 id="albumTitle"></h2>
            <div id="albumContent"></div>
        </section>
    </main>

    <footer>
        <p>Music Explorer | Powered by Last.fm API</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
